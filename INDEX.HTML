<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>AI Mission Control | Nexus Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Deep space theme with electric blue & gold accents */
        :root {
            --bg-deep: #0a0c12;
            --card-bg: rgba(12, 18, 28, 0.75);
            --accent-blue: #3b82f6;
            --accent-gold: #fbbf24;
            --accent-gold-glow: rgba(251, 191, 36, 0.3);
            --border-glow: rgba(59, 130, 246, 0.4);
            --text-primary: #e2e8f0;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Mono', monospace;
            color: var(--text-primary);
            padding: 1.5rem;
            min-height: 100vh;
            position: relative;
        }

        /* VIDEO BACKGROUND - fullscreen immersive */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }
        
        /* Dark overlay to ensure readability and depth, matching video's mood */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 20%, rgba(8, 28, 68, 0.55), rgba(2, 10, 25, 0.85));
            z-index: -1;
            backdrop-filter: blur(1px);
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            width: 100%;
        }

        /* Header — glassmorphic with gold trim */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            margin-bottom: 1.8rem;
            background: rgba(8, 12, 22, 0.5);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background: var(--accent-blue);
            border-radius: 50%;
            animation: pulse 1.6s infinite;
            box-shadow: 0 0 8px var(--accent-blue);
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #ffffff, var(--accent-blue), var(--accent-gold));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .badge {
            background: rgba(59, 130, 246, 0.15);
            padding: 0.25rem 1rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--accent-gold);
            border: 1px solid rgba(251, 191, 36, 0.5);
            font-family: monospace;
        }

        .logout-btn {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 0.5rem 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s;
            font-weight: 500;
            font-size: 0.8rem;
        }

        .logout-btn:hover {
            border-color: var(--accent-blue);
            color: white;
            background: rgba(59, 130, 246, 0.2);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
        }

        /* KPI Grid — gold-accented tiles */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .kpi-card {
            background: rgba(10, 16, 28, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 20px;
            padding: 1rem;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .kpi-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(to bottom, var(--accent-blue), var(--accent-gold));
        }

        .kpi-card:hover {
            border-color: var(--accent-gold);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(251, 191, 36, 0.3);
        }

        .kpi-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .kpi-icon { font-size: 1.4rem; }
        .trend {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 40px;
        }
        .trend.up { background: #064e3b80; color: #4ade80; border: 1px solid #22c55e; }
        .trend.down { background: #7f1d1d80; color: #fca5a5; border: 1px solid #ef4444; }
        .kpi-value {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            color: white;
        }
        .kpi-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        /* Section dividers — gold bar */
        .section-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 1.5rem 0 1rem 0;
        }
        .gold-bar {
            width: 5px;
            height: 22px;
            background: linear-gradient(145deg, var(--accent-blue), var(--accent-gold));
            border-radius: 3px;
            box-shadow: 0 0 6px var(--accent-gold);
        }
        .section-title h2 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #e0f2fe;
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: rgba(15, 30, 55, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(59, 130, 246, 0.5);
            padding: 0.35rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            cursor: pointer;
            color: #c7e2ff;
            transition: all 0.2s;
            font-weight: 500;
        }
        .filter-btn.active {
            background: var(--accent-gold);
            color: #0a0c12;
            border-color: var(--accent-gold);
            font-weight: 700;
            box-shadow: 0 0 12px var(--accent-gold);
        }
        .filter-btn:hover:not(.active) {
            border-color: var(--accent-gold);
            color: white;
        }

        /* Agent Grid — clean cards */
        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .agent-card {
            background: rgba(8, 14, 24, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(59, 130, 246, 0.35);
            border-radius: 20px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .agent-card:hover {
            border-color: var(--accent-gold);
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(251, 191, 36, 0.4);
        }
        .agent-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }
        .agent-info {
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }
        .avatar {
            width: 42px;
            height: 42px;
            background: linear-gradient(145deg, #1e3a8a, #0f172a);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            border: 1px solid var(--accent-blue);
        }
        .agent-name {
            font-weight: 700;
            font-size: 1rem;
        }
        .agent-role {
            font-size: 0.65rem;
            color: var(--accent-gold);
            font-family: monospace;
        }
        .status-light {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            box-shadow: 0 0 6px currentColor;
        }
        .green { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .yellow { background: #eab308; box-shadow: 0 0 8px #eab308; }
        .red { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
        .agent-task {
            font-size: 0.75rem;
            color: #cbd5e1;
            padding-top: 0.5rem;
            border-top: 1px solid rgba(59, 130, 246, 0.3);
            font-family: monospace;
        }

        /* Chat Section — gold accents */
        .chat-container {
            background: rgba(4, 8, 18, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 24px;
            overflow: hidden;
            margin-top: 0.5rem;
        }
        .chat-header {
            background: rgba(8, 18, 35, 0.7);
            padding: 0.8rem;
            border-bottom: 1px solid rgba(251, 191, 36, 0.4);
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            overflow-x: auto;
        }
        .chat-agent-btn {
            background: rgba(15, 30, 55, 0.7);
            border: 1px solid #2d4a7a;
            padding: 0.35rem 0.9rem;
            border-radius: 30px;
            font-size: 0.7rem;
            cursor: pointer;
            color: #bfd9ff;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .chat-agent-btn.active {
            background: var(--accent-gold);
            color: #0a0c12;
            font-weight: 700;
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px var(--accent-gold);
        }
        .messages-area {
            height: 320px;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .message {
            display: flex;
            gap: 0.6rem;
            max-width: 85%;
        }
        .message.outgoing {
            margin-left: auto;
            flex-direction: row-reverse;
        }
        .message-bubble {
            background: rgba(15, 30, 55, 0.8);
            backdrop-filter: blur(4px);
            padding: 0.6rem 1rem;
            border-radius: 18px;
            font-size: 0.8rem;
            line-height: 1.4;
            border: 1px solid #2e5480;
        }
        .message.outgoing .message-bubble {
            background: linear-gradient(135deg, var(--accent-blue), #1e40af);
            color: white;
            border-color: var(--accent-gold);
            box-shadow: 0 2px 8px rgba(59,130,246,0.3);
        }
        .message-meta {
            font-size: 0.55rem;
            color: var(--accent-gold);
            margin-bottom: 0.2rem;
            font-family: monospace;
        }
        .chat-input-area {
            display: flex;
            gap: 0.6rem;
            padding: 1rem;
            border-top: 1px solid rgba(251, 191, 36, 0.4);
            background: rgba(6, 14, 28, 0.8);
        }
        .chat-input {
            flex: 1;
            background: rgba(10, 22, 45, 0.9);
            border: 1px solid var(--accent-gold);
            border-radius: 40px;
            padding: 0.7rem 1rem;
            color: white;
            outline: none;
            font-size: 0.85rem;
        }
        .chat-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 8px var(--accent-blue);
        }
        .send-btn {
            background: var(--accent-gold);
            border: none;
            border-radius: 40px;
            padding: 0 1.4rem;
            font-weight: 700;
            color: #0a0c12;
            cursor: pointer;
            transition: 0.2s;
        }
        .send-btn:hover {
            background: var(--accent-blue);
            color: white;
            box-shadow: 0 0 12px var(--accent-blue);
        }

        /* Login Screen */
        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            z-index: 2;
        }
        .login-card {
            background: rgba(8, 18, 38, 0.8);
            backdrop-filter: blur(16px);
            padding: 2rem;
            border-radius: 32px;
            border: 1px solid var(--accent-gold);
            box-shadow: 0 20px 35px -12px black, 0 0 20px rgba(251, 191, 36, 0.2);
            width: 100%;
            max-width: 420px;
        }
        .login-input {
            width: 100%;
            background: rgba(10, 22, 45, 0.9);
            border: 1px solid var(--accent-gold);
            padding: 0.8rem;
            border-radius: 14px;
            margin: 0.8rem 0;
            color: white;
        }
        .login-input:focus {
            border-color: var(--accent-blue);
            outline: none;
            box-shadow: 0 0 8px var(--accent-blue);
        }
        .login-btn {
            background: var(--accent-gold);
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 14px;
            font-weight: bold;
            margin-top: 0.5rem;
            cursor: pointer;
            color: #0a0c12;
            transition: 0.2s;
        }
        .login-btn:hover {
            background: var(--accent-blue);
            color: white;
            box-shadow: 0 0 15px var(--accent-blue);
        }
        .hidden { display: none; }

        @media (max-width: 768px) {
            body { padding: 0.8rem; }
            .kpi-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
            .agent-grid { grid-template-columns: 1fr; }
            .message { max-width: 95%; }
        }
        @media (max-width: 480px) {
            h1 { font-size: 1.1rem; }
            .kpi-value { font-size: 1.2rem; }
        }

        /* Mobile video fallback - improves performance on phones */
        @media (max-width: 768px) {
            .video-background {
                object-position: center;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .video-background {
                display: none;
            }
            body {
                background: linear-gradient(135deg, #0a0c12 0%, #020617 100%);
            }
        }
    </style>
</head>
<body>

<!-- VIDEO BACKGROUND - pagebackground.mp4 (fully blue cinematic) -->
<video class="video-background" autoplay loop muted playsinline>
    <source src="pagebackground.mp4" type="video/mp4">
    <!-- fallback: subtle gradient if video missing -->
</video>
<div class="overlay"></div>

<div id="app">
    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <div style="text-align:center; margin-bottom:1rem;">
                <span style="font-size: 2.8rem;">🤖</span>
                <h2 style="margin-top:0.5rem; color:white;">Nexus Mission Control</h2>
                <p style="color:var(--accent-gold); font-size:0.8rem;">AI Agent Fleet · 15 active vessels</p>
            </div>
            <input type="email" id="loginEmail" class="login-input" placeholder="Email" value="commander@nexus.ai">
            <input type="password" id="loginPassword" class="login-input" placeholder="Password" value="123456">
            <button class="login-btn" id="doLoginBtn">⚡ ACCESS DASHBOARD</button>
            <p style="font-size:0.65rem; text-align:center; margin-top:1rem; color:#6c8fc0;">Demo: any credentials</p>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboardScreen" class="container hidden">
        <div class="header">
            <div class="logo-area">
                <div class="live-dot"></div>
                <h1>◈ AI Nexus · Mission Control</h1>

        <!-- TOP: Live Business Metrics -->
        <div class="kpi-grid" id="kpiGrid"></div>

        <!-- MIDDLE: Agent List -->
        <div class="section-title">
            <div class="gold-bar"></div>
            <h2>🤖 AGENT FLEET · REAL-TIME STATUS</h2>
        </div>
        <div class="filters" id="agentFilters"></div>
        <div class="agent-grid" id="agentGrid"></div>

        <!-- BOTTOM: Team Chat with AI Agents -->
        <div class="section-title">
            <div class="gold-bar"></div>
            <h2>📡 TEAM COMMS · LIVE CHANNEL</h2>
        </div>
        <div class="chat-container">
            <div class="chat-header" id="chatFilters"></div>
            <div class="messages-area" id="messagesArea"></div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="chatInput" placeholder="Message any agent or team member...">
                <button class="send-btn" id="sendMsgBtn">⟫ SEND</button>
            </div>
        </div>
    </div>
</div>

<script>
    // 15 AI Agents (Sales, Marketing, Content, Finance, Admin roles)
    const AGENTS = [
        { id: 1, name: "Nexus Sales", role: "Sales Pipeline", status: "green", currentTask: "Closing 3 enterprise deals · CRM sync active", icon: "📊", dept: "sales" },
        { id: 2, name: "Vantage", role: "Marketing Ops", status: "green", currentTask: "Running LinkedIn campaign · 47 new leads", icon: "📢", dept: "marketing" },

        { id: 12, name: "Cipher", role: "Data Engineer", status: "green", currentTask: "ETL pipelines · Notion to Supabase sync", icon: "🔧", dept: "finance" },

    // KPI metrics (live business numbers)
    let metrics = [
        { id: "pipeline", label: "DEALS IN PIPELINE", value: "$1.24M", change: 18, icon: "🎯" },

    // Team users (3 users: me, Nick, Mary)
    const TEAM_USERS = [

    // Chat messages history (team + agents)
    let chatMessages = [
        { id: "1", senderType: "user", senderEmail: "commander@nexus.ai", senderName: "Commander", agentId: null, content: "All agents, status report? Team standup in 10min.", timestamp: new Date(Date.now() - 3600000).toISOString() },
        { id: "2", senderType: "agent", senderName: "Nexus Sales", agentId: 1, content: "Pipeline hot. 3 deals at closing stage.", timestamp: new Date(Date.now() - 3500000).toISOString() },
        { id: "3", senderType: "agent", senderName: "Quill", agentId: 3, content: "Content calendar full. 8 posts ready for review.", timestamp: new Date(Date.now() - 3400000).toISOString() },

        { id: "5", senderType: "agent", senderName: "Ledger", agentId: 4, content: "Nick, pulling now. Revenue up 22% YoY.", timestamp: new Date(Date.now() - 2800000).toISOString() },
        { id: "6", senderType: "user", senderEmail: "mary@nexus.ai", senderName: "Mary", agentId: null, content: "Aether, social engagement report please.", timestamp: new Date(Date.now() - 2000000).toISOString() },
        { id: "7", senderType: "agent", senderName: "Aether", agentId: 6, content: "Mary: 1.2k engagements last 7 days. Top post: retreat announcement.", timestamp: new Date(Date.now() - 1800000).toISOString() }
    ];

    let activeChatFilter = null; // null = all, or agentId
    let currentAgentStatusFilter = "all";

    // Helper functions
    function renderKPIs() {
        const container = document.getElementById("kpiGrid");
        if (!container) return;
        container.innerHTML = metrics.map(m => `
            <div class="kpi-card">
                <div class="kpi-header">
                    <span class="kpi-icon">${m.icon}</span>
                    <span class="trend ${m.change >= 0 ? 'up' : 'down'}">${m.change >= 0 ? '▲' : '▼'} ${Math.abs(m.change)}%</span>
                </div>
                <div class="kpi-value">${m.value}</div>
                <div class="kpi-label">${m.label}</div>
            </div>
        `).join('');
    }

    function renderAgentFilters() {
        const container = document.getElementById("agentFilters");
        if (!container) return;
        const counts = {
            all: AGENTS.length,
            green: AGENTS.filter(a => a.status === 'green').length,
            yellow: AGENTS.filter(a => a.status === 'yellow').length,
            red: AGENTS.filter(a => a.status === 'red').length
        };
        container.innerHTML = `
            <button class="filter-btn ${currentAgentStatusFilter === 'all' ? 'active' : ''}" data-filter="all">ALL (${counts.all})</button>
            <button class="filter-btn ${currentAgentStatusFilter === 'green' ? 'active' : ''}" data-filter="green">🟢 OPERATIONAL (${counts.green})</button>
            <button class="filter-btn ${currentAgentStatusFilter === 'yellow' ? 'active' : ''}" data-filter="yellow">🟡 STANDBY (${counts.yellow})</button>
            <button class="filter-btn ${currentAgentStatusFilter === 'red' ? 'active' : ''}" data-filter="red">🔴 OFFLINE (${counts.red})</button>
        `;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentAgentStatusFilter = btn.dataset.filter;
                renderAgentFilters();
                renderAgentGrid();
            });
        });
    }

    function renderAgentGrid() {
        const filtered = currentAgentStatusFilter === "all" ? AGENTS : AGENTS.filter(a => a.status === currentAgentStatusFilter);
        const container = document.getElementById("agentGrid");
        if (!container) return;
        container.innerHTML = filtered.map(agent => `
            <div class="agent-card" data-agent-id="${agent.id}">
                <div class="agent-top">
                    <div class="agent-info">
                        <div class="avatar">${agent.icon}</div>
                        <div>
                            <div class="agent-name">${agent.name}</div>
                            <div class="agent-role">${agent.role}</div>
                        </div>
                    </div>
                    <div class="status-light ${agent.status}"></div>
                </div>
                <div class="agent-task">⟡ ${agent.currentTask}</div>
            </div>
        `).join('');
        document.querySelectorAll('.agent-card').forEach(card => {
            const id = parseInt(card.dataset.agentId);
            card.addEventListener('click', () => {
                const agent = AGENTS.find(a => a.id === id);
                alert(`🤖 AGENT DETAILS\n\nName: ${agent.name}\nRole: ${agent.role}\nStatus: ${agent.status.toUpperCase()}\nCurrent Task: ${agent.currentTask}\nDepartment: ${agent.dept}\nUptime: 99.97% · Active since 2025`);
            });
        });
    }

    function renderChatFilters() {
        const container = document.getElementById("chatFilters");
        if (!container) return;
        let html = `<button class="chat-agent-btn ${activeChatFilter === null ? 'active' : ''}" data-chat-filter="all">🌐 ALL CHANNELS</button>`;
        AGENTS.slice(0, 8).forEach(agent => {
            html += `<button class="chat-agent-btn ${activeChatFilter === agent.id ? 'active' : ''}" data-chat-filter="${agent.id}">🤖 ${agent.name}</button>`;
        });
        html += `<button class="chat-agent-btn" data-chat-filter="more">⚙️ +7 MORE</button>`;
        container.innerHTML = html;
        
        document.querySelectorAll('[data-chat-filter]').forEach(btn => {
            btn.addEventListener('click', () => {
                const val = btn.dataset.chatFilter;
                if (val === 'more') {
                    alert("Full Fleet: Nexus Sales, Vantage, Quill, Ledger, Atlas, Aether, Echo, Pulse, Zephyr, Aegis, Nova, Cipher, Solara, Titan, Oracle");
                    return;
                }
                if (val === 'all') activeChatFilter = null;
                else activeChatFilter = parseInt(val);
                renderChatFilters();
                renderChatMessages();
            });
        });
    }

    function renderChatMessages() {
        const container = document.getElementById("messagesArea");
        if (!container) return;
        let filtered = chatMessages.filter(msg => {
            if (activeChatFilter === null) return true;
            if (msg.agentId === activeChatFilter) return true;
            if (msg.senderType === 'user' && activeChatFilter !== null) return false;
            return false;
        });
        container.innerHTML = filtered.map(msg => {
            const isOutgoing = msg.senderType === 'user' && msg.senderEmail === currentUser.email;
            let senderDisplay = "";
            if (msg.agentId) {
                const agent = AGENTS.find(a => a.id === msg.agentId);
                senderDisplay = `⚡ ${agent?.name || 'Agent'}`;
            } else {
                senderDisplay = `👤 ${msg.senderName}`;
            }
            return `
                <div class="message ${isOutgoing ? 'outgoing' : ''}">
                    <div class="message-bubble">
                        <div class="message-meta">${senderDisplay} • ${new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
                        <div>${escapeHtml(msg.content)}</div>
                    </div>
                </div>
            `;
        }).join('');
        container.scrollTop = container.scrollHeight;
    }

    function sendNewMessage(content) {
        if (!content.trim()) return;
        const newMsg = {
            id: Date.now().toString(),
            senderType: "user",
            senderEmail: currentUser.email,
            senderName: currentUser.name,
            agentId: null,
            content: content,
            timestamp: new Date().toISOString()
        };
        chatMessages.push(newMsg);
        renderChatMessages();
        
        if (activeChatFilter !== null) {
            const targetAgent = AGENTS.find(a => a.id === activeChatFilter);
            if (targetAgent) {
                setTimeout(() => {
                    const replyMsg = {
                        id: Date.now() + "_reply",
                        senderType: "agent",
                        senderName: targetAgent.name,
                        agentId: targetAgent.id,
                        content: `🔵 ${targetAgent.name} acknowledges: "${content.substring(0, 60)}". Currently: ${targetAgent.currentTask}.`,
                        timestamp: new Date().toISOString()
                    };
                    chatMessages.push(replyMsg);
                    renderChatMessages();
                }, 800);
            }
        } else {
            const randomAgent = AGENTS[Math.floor(Math.random() * AGENTS.length)];
            setTimeout(() => {
                const autoReply = {
                    id: Date.now() + "_auto",
                    senderType: "agent",
                    senderName: randomAgent.name,
                    agentId: randomAgent.id,
                    content: `📡 ${randomAgent.name} received. Standing by. Current op: ${randomAgent.currentTask}.`,
                    timestamp: new Date().toISOString()
                };
                chatMessages.push(autoReply);
                renderChatMessages();
            }, 1200);
        }
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function startLiveMetricsSimulation() {
        setInterval(() => {
            metrics = metrics.map(m => {
                let newValue = m.value;
                const rawNum = parseFloat(m.value.replace(/[^0-9.-]/g, ''));
                if (!isNaN(rawNum)) {
                    let factor = 0.95 + Math.random() * 0.1;
                    let updated = Math.floor(rawNum * factor);
                    if (m.id === 'pipeline') newValue = "$" + (updated / 1000).toFixed(0) + "K";
                    else if (m.id === 'cash_in') newValue = "+$" + updated + "K";
                    else if (m.id === 'cash_out') newValue = "$" + updated + "K";
                    else if (m.id === 'social_posts') newValue = updated.toString();
                    else if (m.id === 'new_members') newValue = updated.toString();
                    else if (m.id === 'emails_sent') newValue = updated.toLocaleString();
                    else if (m.id === 'tasks_done') newValue = updated.toString();
                }
                const newChange = Math.floor(Math.random() * 25) - 5;
                return { ...m, value: newValue, change: newChange };
            });
            renderKPIs();
        }, 25000);
    }

    function initAuth() {
        const loginBtn = document.getElementById("doLoginBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        const loginScreen = document.getElementById("loginScreen");
        const dashboard = document.getElementById("dashboardScreen");
        
        loginBtn.addEventListener("click", () => {
            const email = document.getElementById("loginEmail").value;
            const pwd = document.getElementById("loginPassword").value;
            if (email && pwd) {
                const matched = TEAM_USERS.find(u => u.email === email);
                if (matched) currentUser = matched;
                else currentUser = { email: email, name: email.split('@')[0] };
                loginScreen.classList.add("hidden");
                dashboard.classList.remove("hidden");
                renderKPIs();
                renderAgentFilters();
                renderAgentGrid();
                renderChatFilters();
                renderChatMessages();
            } else alert("Enter credentials");
        });
        
        if (logoutBtn) {
            logoutBtn.addEventListener("click", () => {
                dashboard.classList.add("hidden");
                loginScreen.classList.remove("hidden");
                activeChatFilter = null;
                currentAgentStatusFilter = "all";
            });
        }
    }
    
    function bindChatEvents() {
        const sendBtn = document.getElementById("sendMsgBtn");
        const chatInput = document.getElementById("chatInput");
        sendBtn?.addEventListener("click", () => {
            sendNewMessage(chatInput.value);
            chatInput.value = "";
        });
        chatInput?.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                sendNewMessage(chatInput.value);
                chatInput.value = "";
            }
        });
    }
    
    initAuth();
    bindChatEvents();
    startLiveMetricsSimulation();
</script>
</body>
</html>
