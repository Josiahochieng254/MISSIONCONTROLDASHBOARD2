<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>AI Mission Control | 15 Agents Online | Responsive Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a0a0a, #000000);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #e5e7eb;
            padding: clamp(0.75rem, 3vw, 1.5rem);
            min-height: 100vh;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #1f1f1f;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #b45309;
            border-radius: 10px;
        }

        /* Container - Responsive */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Header - Responsive */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: clamp(1rem, 4vw, 1.5rem);
            margin-bottom: clamp(1rem, 4vw, 1.5rem);
            border-bottom: 1px solid rgba(245, 158, 11, 0.2);
            flex-wrap: wrap;
            gap: clamp(0.75rem, 3vw, 1rem);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: clamp(0.5rem, 2vw, 0.75rem);
            flex-wrap: wrap;
        }
        .live-dot {
            width: clamp(8px, 2vw, 10px);
            height: clamp(8px, 2vw, 10px);
            background-color: #f59e0b;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.8);}
            100% { opacity: 1; transform: scale(1.2);}
        }
        h1 {
            font-size: clamp(1.2rem, 5vw, 1.6rem);
            background: linear-gradient(135deg, #ffffff, #fbbf24);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .badge {
            background: rgba(245, 158, 11, 0.15);
            padding: 0.25rem 0.75rem;
            border-radius: 40px;
            font-size: clamp(0.6rem, 2vw, 0.7rem);
            font-weight: 500;
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .logout-btn {
            background: transparent;
            border: 1px solid #2d2d2d;
            color: #9ca3af;
            padding: clamp(0.4rem, 2vw, 0.5rem) clamp(1rem, 3vw, 1.2rem);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            font-size: clamp(0.75rem, 2.5vw, 0.875rem);
        }
        .logout-btn:hover {
            border-color: #f59e0b;
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.05);
        }

        /* KPI Grid - Fully Responsive */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr));
            gap: clamp(0.75rem, 2.5vw, 1rem);
            margin-bottom: clamp(1.5rem, 5vw, 2.5rem);
        }
        .kpi-card {
            background: rgba(18, 18, 18, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid #2a2a2a;
            border-radius: clamp(16px, 4vw, 20px);
            padding: clamp(0.75rem, 3vw, 1rem);
            transition: all 0.2s;
        }
        .kpi-card:hover {
            border-color: #f59e0b;
            transform: translateY(-2px);
        }
        .kpi-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: clamp(0.5rem, 2vw, 0.75rem);
        }
        .kpi-icon {
            font-size: clamp(1.2rem, 4vw, 1.4rem);
        }
        .trend {
            font-size: clamp(0.65rem, 2vw, 0.7rem);
            font-weight: 600;
            padding: 0.2rem 0.4rem;
            border-radius: 20px;
        }
        .trend.up { background: #14532d; color: #4ade80; }
        .trend.down { background: #7f1d1d; color: #f87171; }
        .kpi-value {
            font-size: clamp(1.3rem, 5vw, 1.7rem);
            font-weight: 700;
            margin-bottom: 0.25rem;
            word-break: break-word;
        }
        .kpi-label {
            font-size: clamp(0.65rem, 2vw, 0.7rem);
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9ca3af;
        }

        /* Section Title - Responsive */
        .section-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin: clamp(1rem, 4vw, 1.8rem) 0 clamp(0.75rem, 3vw, 1rem) 0;
        }
        .gold-bar {
            width: 4px;
            height: clamp(16px, 4vw, 20px);
            background: #f59e0b;
            border-radius: 4px;
        }
        .section-title h2 {
            font-size: clamp(1rem, 4vw, 1.3rem);
        }

        /* Agent Filters - Responsive */
        .filters {
            display: flex;
            gap: clamp(0.4rem, 2vw, 0.5rem);
            margin-bottom: clamp(1rem, 3vw, 1.2rem);
            flex-wrap: wrap;
        }
        .filter-btn {
            background: #1a1a1a;
            border: none;
            padding: clamp(0.3rem, 1.5vw, 0.4rem) clamp(0.8rem, 3vw, 1rem);
            border-radius: 40px;
            font-size: clamp(0.7rem, 2.5vw, 0.8rem);
            cursor: pointer;
            color: #9ca3af;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .filter-btn.active {
            background: #f59e0b;
            color: #000;
            font-weight: 600;
        }

        /* Agent Grid - Responsive Cards */
        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
            gap: clamp(0.75rem, 2.5vw, 1rem);
            margin-bottom: clamp(1.5rem, 4vw, 2rem);
        }
        .agent-card {
            background: #111111;
            border: 1px solid #262626;
            border-radius: clamp(16px, 4vw, 20px);
            padding: clamp(0.75rem, 3vw, 1rem);
            cursor: pointer;
            transition: all 0.2s;
        }
        .agent-card:hover {
            border-color: #f59e0b;
            transform: translateY(-3px);
            background: #161616;
        }
        .agent-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .agent-info {
            display: flex;
            align-items: center;
            gap: clamp(0.5rem, 2vw, 0.7rem);
            flex: 1;
        }
        .avatar {
            width: clamp(35px, 8vw, 40px);
            height: clamp(35px, 8vw, 40px);
            background: linear-gradient(145deg, #2a2a2a, #1e1e1e);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.1rem, 4vw, 1.3rem);
            flex-shrink: 0;
        }
        .agent-name {
            font-weight: 700;
            font-size: clamp(0.9rem, 3vw, 1rem);
        }
        .agent-role {
            font-size: clamp(0.65rem, 2.5vw, 0.7rem);
            color: #a1a1aa;
        }
        .status-light {
            width: clamp(8px, 2.5vw, 10px);
            height: clamp(8px, 2.5vw, 10px);
            border-radius: 50%;
            flex-shrink: 0;
        }
        .green { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
        .yellow { background: #eab308; box-shadow: 0 0 6px #eab308; }
        .red { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
        .agent-task {
            font-size: clamp(0.75rem, 2.5vw, 0.8rem);
            color: #cbd5e1;
            padding-top: 0.5rem;
            border-top: 1px solid #252525;
            word-break: break-word;
        }

        /* Chat Section - Fully Responsive */
        .chat-container {
            background: #0c0c0c;
            border: 1px solid #2a2a2a;
            border-radius: clamp(20px, 5vw, 24px);
            overflow: hidden;
            margin-top: 0.5rem;
        }
        .chat-header {
            background: #0f0f0f;
            padding: clamp(0.6rem, 2.5vw, 0.8rem);
            border-bottom: 1px solid #262626;
            display: flex;
            gap: clamp(0.4rem, 2vw, 0.5rem);
            flex-wrap: wrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .chat-agent-btn {
            background: #1f1f1f;
            border: none;
            padding: clamp(0.3rem, 1.5vw, 0.4rem) clamp(0.7rem, 2.5vw, 0.9rem);
            border-radius: 30px;
            font-size: clamp(0.7rem, 2.5vw, 0.75rem);
            cursor: pointer;
            color: #aaa;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .chat-agent-btn.active {
            background: #f59e0b;
            color: black;
            font-weight: 600;
        }
        .messages-area {
            height: clamp(280px, 40vh, 320px);
            overflow-y: auto;
            padding: clamp(0.75rem, 3vw, 1rem);
            display: flex;
            flex-direction: column;
            gap: clamp(0.6rem, 2vw, 0.8rem);
        }
        .message {
            display: flex;
            gap: clamp(0.4rem, 2vw, 0.6rem);
            max-width: min(85%, 400px);
        }
        .message.outgoing {
            margin-left: auto;
            flex-direction: row-reverse;
        }
        .message-bubble {
            background: #1e1e1e;
            padding: clamp(0.5rem, 2vw, 0.6rem) clamp(0.75rem, 2.5vw, 1rem);
            border-radius: 18px;
            font-size: clamp(0.8rem, 2.5vw, 0.85rem);
            line-height: 1.4;
            word-break: break-word;
        }
        .message.outgoing .message-bubble {
            background: #f59e0b;
            color: black;
        }
        .message-meta {
            font-size: clamp(0.55rem, 2vw, 0.6rem);
            color: #777;
            margin-bottom: 0.2rem;
        }
        .chat-input-area {
            display: flex;
            gap: clamp(0.4rem, 2vw, 0.5rem);
            padding: clamp(0.75rem, 3vw, 1rem);
            border-top: 1px solid #262626;
            background: #0a0a0a;
            flex-wrap: wrap;
        }
        .chat-input {
            flex: 1;
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 40px;
            padding: clamp(0.6rem, 2.5vw, 0.7rem) clamp(0.8rem, 3vw, 1rem);
            color: white;
            outline: none;
            font-size: clamp(0.8rem, 2.5vw, 0.85rem);
            min-width: 120px;
        }
        .chat-input:focus {
            border-color: #f59e0b;
        }
        .send-btn {
            background: #f59e0b;
            border: none;
            border-radius: 40px;
            padding: 0 clamp(1rem, 4vw, 1.4rem);
            font-weight: bold;
            color: black;
            cursor: pointer;
            font-size: clamp(0.8rem, 2.5vw, 0.85rem);
            white-space: nowrap;
        }

        /* Login Screen - Responsive */
        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 30% 10%, #000, #0a0a0a);
            padding: 1rem;
        }
        .login-card {
            background: #0f0f0f;
            padding: clamp(1.5rem, 6vw, 2rem);
            border-radius: clamp(24px, 6vw, 32px);
            border: 1px solid #f59e0b30;
            width: 100%;
            max-width: 400px;
            margin: 1rem;
        }
        .login-input {
            width: 100%;
            background: #1e1e1e;
            border: 1px solid #333;
            padding: clamp(0.7rem, 2.5vw, 0.8rem);
            border-radius: 14px;
            margin: 0.8rem 0;
            color: white;
            font-size: clamp(0.8rem, 2.5vw, 0.9rem);
        }
        .login-btn {
            background: #f59e0b;
            width: 100%;
            padding: clamp(0.7rem, 2.5vw, 0.8rem);
            border: none;
            border-radius: 14px;
            font-weight: bold;
            margin-top: 0.5rem;
            cursor: pointer;
            font-size: clamp(0.9rem, 3vw, 1rem);
        }

        .hidden {
            display: none;
        }

        /* Mobile optimizations */
        @media (max-width: 640px) {
            body {
                padding: 0.75rem;
            }
            .kpi-grid {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            }
            .agent-grid {
                grid-template-columns: 1fr;
            }
            .message {
                max-width: 90%;
            }
            .chat-agent-btn {
                font-size: 0.7rem;
            }
        }

        @media (max-width: 480px) {
            .logo-area {
                width: 100%;
                justify-content: space-between;
            }
            .logout-btn {
                width: 100%;
                text-align: center;
            }
            .kpi-card {
                padding: 0.6rem;
            }
            .kpi-value {
                font-size: 1.2rem;
            }
        }

        @media (min-width: 1024px) {
            .agent-grid {
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            }
        }

        /* Touch-friendly */
        @media (hover: none) {
            .agent-card:active {
                transform: scale(0.98);
                background: #1a1a1a;
            }
            button {
                -webkit-tap-highlight-color: transparent;
            }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- LOGIN SECTION -->
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <div style="text-align:center; margin-bottom:1rem;">
                <span style="font-size: clamp(2rem, 8vw, 2.5rem);">🤖</span>
                <h2 style="margin-top:0.5rem; font-size: clamp(1.3rem, 5vw, 1.6rem);">AI Mission Control</h2>
                <p style="color:#aaa; font-size: clamp(0.75rem, 3vw, 0.85rem);">Sign in to command agents</p>
            </div>
            <input type="email" id="loginEmail" class="login-input" placeholder="Email" value="me@example.com">
            <input type="password" id="loginPassword" class="login-input" placeholder="Password" value="123456">
            <button class="login-btn" id="doLoginBtn">🚀 Access Dashboard</button>
            <p style="font-size:0.7rem; text-align:center; margin-top:1rem; color:#555;">demo: any email / any password</p>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboardScreen" class="container hidden">
        <div class="header">
            <div class="logo-area">
                <div class="live-dot"></div>
                <h1>AI Mission Control</h1>
                <div class="badge">15 AGENTS ACTIVE</div>
            </div>
            <button class="logout-btn" id="logoutBtn">← Sign Out</button>
        </div>

        <!-- TOP: KPI SECTION -->
        <div class="kpi-grid" id="kpiGrid"></div>

        <!-- MIDDLE: AGENTS -->
        <div class="section-title">
            <div class="gold-bar"></div>
            <h2>🤖 Agent Fleet</h2>
        </div>
        <div class="filters" id="agentFilters"></div>
        <div class="agent-grid" id="agentGrid"></div>

        <!-- BOTTOM: CHAT -->
        <div class="section-title">
            <div class="gold-bar"></div>
            <h2>💬 Team & Agent Chat</h2>
        </div>
        <div class="chat-container">
            <div class="chat-header" id="chatFilters"></div>
            <div class="messages-area" id="messagesArea"></div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="chatInput" placeholder="Type a message...">
                <button class="send-btn" id="sendMsgBtn">Send →</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ---------- DATA ----------
    const agents = [
        { id: 1, name: "Aurora", role: "Sales Lead", status: "green", currentTask: "Qualifying inbound leads", icon: "📈" },
        { id: 2, name: "Nexus", role: "Marketing", status: "green", currentTask: "Optimizing ad campaigns", icon: "📊" },
        { id: 3, name: "Scribe", role: "Content Writer", status: "green", currentTask: "Drafting blog post", icon: "✍️" },
        { id: 4, name: "Ledger", role: "Finance", status: "yellow", currentTask: "Reconciling API data", icon: "💰" },
        { id: 5, name: "Sentinel", role: "Admin", status: "green", currentTask: "Monitoring servers", icon: "🛡️" },
        { id: 6, name: "Pulse", role: "Social Media", status: "green", currentTask: "Scheduling tweets", icon: "🐦" },
        { id: 7, name: "Vector", role: "CRM Sync", status: "red", currentTask: "GoHighLevel rate limit", icon: "🔄" },
        { id: 8, name: "Echo", role: "Customer Support", status: "yellow", currentTask: "Handling 3 tickets", icon: "🎧" },
        { id: 9, name: "Nova", role: "Lead Gen", status: "green", currentTask: "Scraping new contacts", icon: "🔍" },
        { id: 10, name: "Cipher", role: "Security", status: "green", currentTask: "Log analysis", icon: "🔒" },
        { id: 11, name: "Vox", role: "Voice AI", status: "yellow", currentTask: "Processing voice notes", icon: "🎙️" },
        { id: 12, name: "Loom", role: "Notion Sync", status: "green", currentTask: "Updating tasks DB", icon: "📝" },
        { id: 13, name: "Blaze", role: "Blotato API", status: "green", currentTask: "Publishing carousel", icon: "⚡" },
        { id: 14, name: "Atlas", role: "Analytics", status: "green", currentTask: "Building report", icon: "🧠" },
        { id: 15, name: "Kode", role: "DevOps", status: "green", currentTask: "Deploying updates", icon: "💻" }
    ];

    let currentUser = { email: "me@example.com", name: "Me" };
    let kpiData = [
        { id: "deals", label: "Deals in Pipeline", value: "$342,500", change: 12, icon: "💼" },
        { id: "cashflow", label: "Money In / Out", value: "+$48.2K / -$22.1K", change: 8, icon: "💵" },
        { id: "social", label: "Posts Published", value: "147", change: 23, icon: "📱" },
        { id: "members", label: "New Members", value: "892", change: -3, icon: "👥" },
        { id: "emails", label: "Emails Sent", value: "12,847", change: 18, icon: "✉️" },
        { id: "tasks", label: "Tasks Done", value: "2,341", change: 34, icon: "✅" }
    ];

    let messages = [
        { id: "1", sender: "me@example.com", senderName: "Me", agentId: null, content: "Good morning team! How are agents performing?", timestamp: new Date(Date.now() - 3600000).toISOString() },
        { id: "2", sender: "agent", senderName: "Aurora", agentId: 1, content: "All leads are qualified. Ready for follow-ups.", timestamp: new Date(Date.now() - 3500000).toISOString() },
        { id: "3", sender: "nick@example.com", senderName: "Nick", agentId: null, content: "Marketing campaigns are up 12%", timestamp: new Date(Date.now() - 3400000).toISOString() },
        { id: "4", sender: "agent", senderName: "Vector", agentId: 7, content: "⚠️ CRM rate limit hit, retrying in 5min", timestamp: new Date(Date.now() - 3000000).toISOString() },
        { id: "5", sender: "mary@example.com", senderName: "Mary", agentId: null, content: "Content queue is full, Scribe is crushing it", timestamp: new Date(Date.now() - 2000000).toISOString() },
    ];

    let activeChatAgent = null;
    let currentAgentFilter = "all";

    // Render Functions
    function renderKPIs() {
        const container = document.getElementById("kpiGrid");
        if (!container) return;
        container.innerHTML = kpiData.map(kpi => `
            <div class="kpi-card">
                <div class="kpi-header">
                    <span class="kpi-icon">${kpi.icon}</span>
                    <span class="trend ${kpi.change >= 0 ? 'up' : 'down'}">${kpi.change >= 0 ? '+' : ''}${kpi.change}%</span>
                </div>
                <div class="kpi-value">${kpi.value}</div>
                <div class="kpi-label">${kpi.label}</div>
            </div>
        `).join('');
    }

    function renderAgents() {
        const filtered = currentAgentFilter === "all" ? agents : agents.filter(a => a.status === currentAgentFilter);
        const container = document.getElementById("agentGrid");
        if (!container) return;
        container.innerHTML = filtered.map(agent => `
            <div class="agent-card" data-agent-id="${agent.id}">
                <div class="agent-top">
                    <div class="agent-info">
                        <div class="avatar">${agent.icon}</div>
                        <div>
                            <div class="agent-name">${agent.name}</div>
                            <div class="agent-role">${agent.role}</div>
                        </div>
                    </div>
                    <div class="status-light ${agent.status}"></div>
                </div>
                <div class="agent-task">🏃 ${agent.currentTask}</div>
            </div>
        `).join('');
        
        document.querySelectorAll('.agent-card').forEach(card => {
            const id = parseInt(card.dataset.agentId);
            card.addEventListener('click', () => showAgentDetails(id));
        });
    }

    function showAgentDetails(agentId) {
        const agent = agents.find(a => a.id === agentId);
        if (!agent) return;
        alert(`🤖 ${agent.name} (${agent.role})\nStatus: ${agent.status.toUpperCase()}\nCurrent Task: ${agent.currentTask}\nUptime: 99.97% | Messages handled: ${Math.floor(Math.random() * 5000)}`);
    }

    function renderFilters() {
        const container = document.getElementById("agentFilters");
        if (!container) return;
        const counts = {
            all: agents.length,
            green: agents.filter(a => a.status === 'green').length,
            yellow: agents.filter(a => a.status === 'yellow').length,
            red: agents.filter(a => a.status === 'red').length,
        };
        container.innerHTML = `
            <button class="filter-btn ${currentAgentFilter === 'all' ? 'active' : ''}" data-filter="all">All (${counts.all})</button>
            <button class="filter-btn ${currentAgentFilter === 'green' ? 'active' : ''}" data-filter="green">🟢 Green (${counts.green})</button>
            <button class="filter-btn ${currentAgentFilter === 'yellow' ? 'active' : ''}" data-filter="yellow">🟡 Yellow (${counts.yellow})</button>
            <button class="filter-btn ${currentAgentFilter === 'red' ? 'active' : ''}" data-filter="red">🔴 Red (${counts.red})</button>
        `;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                currentAgentFilter = btn.dataset.filter;
                renderFilters();
                renderAgents();
            });
        });
    }

    function renderChatFilters() {
        const container = document.getElementById("chatFilters");
        if (!container) return;
        container.innerHTML = `
            <button class="chat-agent-btn ${activeChatAgent === null ? 'active' : ''}" data-chat-agent="null">🏠 All Team</button>
            ${agents.slice(0,6).map(agent => `<button class="chat-agent-btn ${activeChatAgent === agent.id ? 'active' : ''}" data-chat-agent="${agent.id}">🤖 ${agent.name}</button>`).join('')}
            <button class="chat-agent-btn" data-chat-agent="more" style="background:#2c2c2c;">➕ More</button>
        `;
        document.querySelectorAll('[data-chat-agent]').forEach(btn => {
            btn.addEventListener('click', () => {
                const val = btn.dataset.chatAgent;
                if (val === 'more') {
                    alert("All 15 agents: Aurora, Nexus, Scribe, Ledger, Sentinel, Pulse, Vector, Echo, Nova, Cipher, Vox, Loom, Blaze, Atlas, Kode");
                    return;
                }
                activeChatAgent = val === 'null' ? null : parseInt(val);
                renderChatFilters();
                renderMessages();
            });
        });
    }

    function renderMessages() {
        const container = document.getElementById("messagesArea");
        if (!container) return;
        let filteredMsgs = messages.filter(m => {
            if (activeChatAgent === null) return true;
            if (m.agentId === activeChatAgent) return true;
            if (m.agentId === null && activeChatAgent !== null) return false;
            return false;
        });
        container.innerHTML = filteredMsgs.map(msg => {
            const isOutgoing = msg.sender === currentUser.email;
            const senderDisplay = msg.agentId ? `🤖 ${agents.find(a=>a.id===msg.agentId)?.name || 'Agent'}` : (msg.senderName || msg.sender.split('@')[0]);
            return `
                <div class="message ${isOutgoing ? 'outgoing' : ''}">
                    <div class="message-bubble">
                        <div class="message-meta">${senderDisplay} • ${new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
                        <div>${escapeHtml(msg.content)}</div>
                    </div>
                </div>
            `;
        }).join('');
        container.scrollTop = container.scrollHeight;
    }

    function sendMessage(content) {
        if (!content.trim()) return;
        const newMsg = {
            id: Date.now().toString(),
            sender: currentUser.email,
            senderName: currentUser.name,
            agentId: activeChatAgent,
            content: content,
            timestamp: new Date().toISOString()
        };
        messages.push(newMsg);
        renderMessages();

        if (activeChatAgent !== null) {
            setTimeout(() => {
                const agentObj = agents.find(a => a.id === activeChatAgent);
                if (agentObj) {
                    const reply = {
                        id: Date.now().toString() + "-reply",
                        sender: "agent",
                        senderName: agentObj.name,
                        agentId: activeChatAgent,
                        content: `✅ ${agentObj.name} received: "${content.substring(0,50)}". Working on ${agentObj.currentTask.toLowerCase()}.`,
                        timestamp: new Date().toISOString()
                    };
                    messages.push(reply);
                    renderMessages();
                }
            }, 800);
        }
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function startLiveKPISimulation() {
        setInterval(() => {
            kpiData = kpiData.map(kpi => {
                let newVal = kpi.value;
                if (kpi.id === 'deals') newVal = "$" + (Math.floor(Math.random() * 100) + 300) + "K";
                else if (kpi.id === 'social') newVal = Math.floor(Math.random() * 300) + 100;
                else if (kpi.id === 'tasks') newVal = Math.floor(Math.random() * 4000) + 1500;
                else if (kpi.id === 'emails') newVal = Math.floor(Math.random() * 20000) + 8000;
                else if (kpi.id === 'members') newVal = Math.floor(Math.random() * 500) + 500;
                else if (kpi.id === 'cashflow') newVal = `+$${(Math.random() * 50).toFixed(1)}K / -$${(Math.random() * 30).toFixed(1)}K`;
                const newChange = Math.floor(Math.random() * 35) - 5;
                return { ...kpi, value: newVal, change: newChange };
            });
            renderKPIs();
        }, 25000);
    }

    function initAuth() {
        const loginBtn = document.getElementById("doLoginBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        const loginScreen = document.getElementById("loginScreen");
        const dashboard = document.getElementById("dashboardScreen");

        loginBtn.addEventListener("click", () => {
            const email = document.getElementById("loginEmail").value;
            const pwd = document.getElementById("loginPassword").value;
            if (email && pwd) {
                currentUser.email = email;
                currentUser.name = email.split('@')[0];
                loginScreen.classList.add("hidden");
                dashboard.classList.remove("hidden");
                renderKPIs();
                renderFilters();
                renderAgents();
                renderChatFilters();
                renderMessages();
            } else {
                alert("Enter email & password");
            }
        });

        if (logoutBtn) {
            logoutBtn.addEventListener("click", () => {
                dashboard.classList.add("hidden");
                loginScreen.classList.remove("hidden");
                document.getElementById("loginEmail").value = "me@example.com";
                document.getElementById("loginPassword").value = "123456";
                activeChatAgent = null;
                currentAgentFilter = "all";
            });
        }
    }

    function bindChatEvents() {
        const sendBtn = document.getElementById("sendMsgBtn");
        const chatInput = document.getElementById("chatInput");
        if (sendBtn) {
            sendBtn.addEventListener("click", () => {
                sendMessage(chatInput.value);
                chatInput.value = "";
            });
        }
        if (chatInput) {
            chatInput.addEventListener("keypress", (e) => {
                if (e.key === "Enter") {
                    sendMessage(chatInput.value);
                    chatInput.value = "";
                }
            });
        }
    }

    function init() {
        initAuth();
        bindChatEvents();
        startLiveKPISimulation();
    }

    init();
</script>
</body>
</html>
